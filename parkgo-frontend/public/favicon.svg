<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="14 8 44 52">
  <defs>
    <!-- Deep navy -> indigo -> violet for the P -->
    <linearGradient id="pFill" x1="20" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a1b4d"/>
      <stop offset="0.5" stop-color="#2b2b6e"/>
      <stop offset="1" stop-color="#1b2a5e"/>
    </linearGradient>
    <!-- Bright blue lightning bolt -->
    <linearGradient id="boltFill" x1="18" y1="14" x2="34" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f6fd0"/>
      <stop offset="0.55" stop-color="#2b4a94"/>
      <stop offset="1" stop-color="#16234f"/>
    </linearGradient>
  </defs>

  <!-- Soft ground shadow -->
  <ellipse cx="34" cy="57.5" rx="9" ry="1.8" fill="#0d0d18" opacity="0.12"/>

  <!-- The "P": vertical stem + bowl -->
  <path fill="url(#pFill)" d="
    M27 11h13.5c8 0 13.5 5.4 13.5 13.2 0 7.8-5.5 13.3-13.5 13.3H33v9l-6-6V11Z
    M33 19v11h6.5c3.6 0 5.9-2.2 5.9-5.5S43.1 19 39.5 19H33Z" />

  <!-- Lightning bolt cutting through the P -->
  <path fill="url(#boltFill)" d="
    M31 12 L18.5 33 h7.5 L20 55 L38 28 h-8.5 L36 12 Z" />
</svg>
