# Render Blueprint for ParkGo (https://render.com/docs/blueprint-spec)
#
# NOTE: Your two services already exist (created manually in the dashboard), so
# this file does NOT reconfigure them automatically. It documents the correct
# setup and lets the whole stack be recreated from scratch via "New +" ->
# "Blueprint". The single thing the existing frontend still needs is the
# rewrite rule below (Settings -> Redirects/Rewrites in the dashboard).

services:
  # ---------- Backend API (Express + Supabase) ----------
  - type: web
    name: parkgo-backend
    runtime: node
    rootDir: parkgo-backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://parkgo-frontend.onrender.com
      - key: JWT_EXPIRES_IN
        value: 7d
      # Secrets — set these in the dashboard, do NOT commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        sync: false

  # ---------- Frontend (Vite SPA, served by its own Node server) ----------
  #
  # Runs as a Node service rather than a `runtime: static` site, on purpose.
  #
  # A static site needs a host-level rewrite (/* -> /index.html) or every page
  # refresh on a deep link like /subscriber returns 404. That rewrite lived only
  # in the Render dashboard — invisible to this repo — and was never actually
  # applied, so refreshes broke in production. `public/_redirects` did not help:
  # that is a Netlify convention, and Render just serves the file verbatim.
  #
  # parkgo-frontend/server.js does the fallback in code, so it is version
  # controlled, testable locally, and survives a service rebuild.
  - type: web
    name: parkgo-frontend
    runtime: node
    rootDir: parkgo-frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        value: https://parkgo-automated-parking-management.onrender.com/api
